<nav>
  <a href="/">
    <h1>{{ site.Title }}</h1>
  </a>

  <div id="react-search" class="search-root" aria-label="Site Search"></div>

  {{- $translationEnabled := .Site.Params.translation.enabled | default true -}}
  {{- if $translationEnabled -}}
  <div id="google_translate_element" class="translate-widget" aria-label="Translate this page"></div>
  {{- end -}}

  <div class="nav-links">
    {{- $label := "Notes" -}}
    {{- $url := "/notes/" -}}
    {{- if eq .Section "notes" -}}
      {{- $label = "Posts" -}}
      {{- $url = "/posts/" -}}
    {{- end -}}
    <a href="{{ $url }}">{{ $label }}</a>
  </div>
</nav>
