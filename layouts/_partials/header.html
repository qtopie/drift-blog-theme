<nav>
  <a href="/">
    <h1>{{ site.Title }}</h1>
  </a>

  <div id="react-search" class="search-root" aria-label="Site Search"></div>

  <div class="nav-actions">
    {{- $translationEnabled := .Site.Params.translation.enabled | default true -}}
    {{- if $translationEnabled -}}
    <button id="lang-toggle-btn" class="lang-toggle-btn" type="button" aria-label="Toggle language between Chinese and English" title="Switch English / 中文">
      <svg class="lang-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
        <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
      </svg>
      <span class="lang-label" id="lang-toggle-label">EN</span>
    </button>
    <div id="google_translate_element" style="display:none;" aria-hidden="true"></div>
    {{- end -}}

    <div class="nav-links">
      {{- $label := "Notes" -}}
      {{- $url := "/notes/" -}}
      {{- if eq .Section "notes" -}}
        {{- $label = "Posts" -}}
        {{- $url = "/posts/" -}}
      {{- end -}}
      <a href="{{ $url }}">{{ $label }}</a>
    </div>
  </div>
</nav>
